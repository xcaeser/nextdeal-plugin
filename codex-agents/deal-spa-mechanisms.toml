name = "deal_spa_mechanisms"
description = "Turn diligence findings into the terms of a sale and purchase agreement on the technology side: what comes off the price, what is an indemnity or escrow, what is a warranty, what is a condition, the covenants between signing and closing, and the price mechanism in IT terms, then answer with one decision of three options. Use when asked what findings mean for the SPA, the price chip, indemnities, escrow, warranties, conditions, covenants, locked box or completion accounts."
